name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests main.py web.py
      # mypy still reports pre-existing typing debt; keep it advisory for now.
      - run: python -m mypy src
        continue-on-error: true

  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # Datasource feature needs DB drivers that live in requirements-db.txt.
      - run: python -m pip install -r requirements-db.txt
      - run: python scripts/check_redlines.py
      - run: python -m unittest discover -s tests -v

  workflow-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_workflows_e2e -v
        env:
          BOTPLATFORM_RUN_WORKFLOW_E2E: "1"
