{% extends "base.html" %}
{% block title %}对话 - BotPlatform{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/chat.css?v=20260729a">{% endblock %}
{% block content %}
<div class="chat-page">
    <aside class="conv-sidebar">
        <div class="conv-sidebar-header">
            <button id="new-conv-btn" class="btn-primary new-conv-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新建对话
            </button>
        </div>
        <div id="conv-list" class="conv-list"></div>
    </aside>
    <div class="chat-main">
        <div id="chat-messages" class="chat-messages">
            <div id="welcome-screen" class="welcome-screen">
                <div class="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h2 id="welcome-title">你好，有什么可以帮你的？</h2>
                <div id="welcome-hints" class="welcome-hints"></div>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="input-toolbar">
                <div class="agent-multiselect">
                    <button id="agent-select-btn" class="agent-select-btn" type="button">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M16 14H8a4 4 0 0 0-4 4v2h16v-2a4 4 0 0 0-4-4z"/></svg>
                        <span id="agent-select-label">选择智能体</span>
                        <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                </div>
            </div>
            <form id="chat-form" class="chat-input-box">
                <textarea id="chat-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." rows="1" autofocus></textarea>
                <button type="submit" id="send-btn" class="send-btn" title="发送">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </form>
            <p class="input-disclaimer">内容由 AI 生成，仅供参考</p>
        </div>
    </div>
</div>

<!-- Agent selection modal -->
<div id="agent-modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal agent-modal">
        <div class="modal-header">
            <h3>选择智能体</h3>
            <button class="modal-close-btn" id="agent-modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div id="agent-modal-list" class="agent-modal-list"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/vendor/marked/marked.umd.js"></script>
<script src="/static/vendor/dompurify/purify.min.js"></script>
<script src="/static/js/chat.js?v=20260730a"></script>
<script>initChat();</script>
{% endblock %}
