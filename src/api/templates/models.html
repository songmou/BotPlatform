{% extends "base.html" %}
{% block title %}模型管理 - BotPlatform{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="page-header-row">
            <div>
                <h2>模型管理</h2>
                <p class="page-desc">管理多厂商模型档案，支持切换主模型</p>
            </div>
            <button id="create-model-btn" class="btn-primary">+ 添加模型</button>
        </div>
    </div>
    <div id="model-status" class="status-card"></div>
    <div id="model-list" class="card-grid"></div>
</div>

<!-- Modal -->
<div id="model-modal" class="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3 id="model-modal-title">添加模型</h3>
            <button id="model-modal-close" class="modal-close-btn">&times;</button>
        </div>
        <form id="model-form" class="modal-body">
            <div class="form-group" id="model-id-group">
                <label for="model-id">档案 ID</label>
                <input type="text" id="model-id" placeholder="如 alibaba_qwen" required pattern="^[a-z][a-z0-9_]{0,63}$">
                <small>小写字母开头，可含数字和下划线</small>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="model-provider">厂商</label>
                    <div class="dropdown-wrap">
                        <input type="text" id="model-provider" placeholder="如 alibaba, deepseek, openai" autocomplete="off">
                        <div id="provider-dropdown" class="dropdown-list" style="display:none">
                            <div class="dropdown-item" data-value="alibaba">alibaba</div>
                            <div class="dropdown-item" data-value="deepseek">deepseek</div>
                            <div class="dropdown-item" data-value="openai">openai</div>
                            <div class="dropdown-item" data-value="ollama">ollama</div>
                            <div class="dropdown-item" data-value="zhipu">zhipu</div>
                            <div class="dropdown-item" data-value="moonshot">moonshot</div>
                            <div class="dropdown-item" data-value="siliconflow">siliconflow</div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="model-type">类型</label>
                    <select id="model-type">
                        <option value="openai_compatible">OpenAI 兼容</option>
                        <option value="ollama">Ollama 本地</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="model-base-url">API 地址</label>
                <input type="text" id="model-base-url" placeholder="如 https://dashscope.aliyuncs.com/compatible-mode/v1">
            </div>
            <div class="form-group">
                <label for="model-name">模型名称</label>
                <input type="text" id="model-name" placeholder="如 qwen-plus, deepseek-chat, gpt-4o" required>
            </div>
            <div class="form-group">
                <label for="model-api-key-env">API Key 环境变量名</label>
                <input type="text" id="model-api-key-env" placeholder="如 DASHSCOPE_API_KEY, DEEPSEEK_API_KEY">
                <small>在 data/system/model.env 中配置对应的 KEY=值</small>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="model-temperature">温度</label>
                    <input type="number" id="model-temperature" value="0.7" min="0" max="2" step="0.1">
                </div>
                <div class="form-group">
                    <label for="model-max-tokens">最大 Token</label>
                    <input type="number" id="model-max-tokens" value="2048" min="256" step="256">
                </div>
                <div class="form-group">
                    <label for="model-timeout">超时(秒)</label>
                    <input type="number" id="model-timeout" value="120" min="10">
                </div>
            </div>
            <div class="form-group">
                <label class="checkbox-label"><input type="checkbox" id="model-enabled" checked> 启用</label>
            </div>
            <div class="modal-footer">
                <button type="button" id="model-modal-cancel" class="btn-secondary">取消</button>
                <button type="submit" class="btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>initModels();</script>
{% endblock %}
