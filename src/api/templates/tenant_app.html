<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组织工作台 - BotPlatform</title>
    <script>
        (function () {
            try {
                document.documentElement.setAttribute(
                    "data-theme",
                    localStorage.getItem("bp-theme") || "light"
                );
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/app.css?v=20260731-org">
    <link rel="stylesheet" href="/static/css/tenant-app.css?v=20260731-org">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <header class="tenant-header">
        <div>
            <strong>BotPlatform</strong>
            <span>组织工作台</span>
        </div>
        <div class="tenant-header-actions">
            <select id="organization-switch" aria-label="切换组织"></select>
            <span id="tenant-current-user"></span>
            <button id="tenant-logout" class="btn-secondary" type="button">退出</button>
        </div>
    </header>
    <main class="tenant-shell">
        <aside class="tenant-nav">
            <button class="tenant-nav-item active" data-resource="agents">智能体</button>
            <button class="tenant-nav-item" data-resource="models">模型</button>
            <button class="tenant-nav-item" data-resource="skills">Skill</button>
            <button class="tenant-nav-item" data-resource="plugins">插件</button>
            <button class="tenant-nav-item" data-resource="mcp">MCP</button>
            <button class="tenant-nav-item" data-resource="channels">渠道</button>
            <button class="tenant-nav-item" data-resource="schedules">自动化</button>
            <button class="tenant-nav-item" data-view="knowledge">知识库</button>
            <button class="tenant-nav-item" data-view="drive">文件</button>
            <button class="tenant-nav-item" data-view="members">成员</button>
        </aside>
        <section class="tenant-content">
            <div class="tenant-title-row">
                <div>
                    <h1 id="tenant-view-title">智能体</h1>
                    <p id="tenant-view-subtitle">公共资源与组织自有配置</p>
                </div>
                <div>
                    <button id="tenant-primary-action" class="btn-primary" type="button">新建</button>
                    <button id="tenant-refresh" class="btn-secondary" type="button">刷新</button>
                </div>
            </div>
            <div id="tenant-summary" class="tenant-summary"></div>
            <div id="tenant-resource-list" class="tenant-card-grid"></div>
        </section>
    </main>
    <script src="/static/js/tenant-app.js?v=20260731-org"></script>
</body>
</html>
