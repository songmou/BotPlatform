{% extends "base.html" %}
{% block title %}用户管理 - BotPlatform{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/users.css">{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="page-header-row">
            <div>
                <h2 id="users-title">机器人用户</h2>
                <p class="page-desc" id="users-desc">管理通过机器人接入的终端用户（租户）</p>
            </div>
            <button id="create-admin-btn" class="btn-primary" style="display:none">+ 新建账号</button>
        </div>
    </div>

    <div id="users-tab-tenants" class="users-tab">
        <div id="tenant-empty" class="status-card" style="display:none">暂无机器人用户</div>
        <table class="data-table" id="tenant-table" style="display:none">
            <thead>
                <tr>
                    <th>租户 ID</th>
                    <th>渠道</th>
                    <th>用户标识</th>
                    <th>创建时间</th>
                    <th>消息数</th>
                    <th>最近活跃</th>
                    <th>模型模式</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tenant-tbody"></tbody>
        </table>
    </div>

    <div id="users-tab-admins" class="users-tab" style="display:none">
        <table class="data-table" id="admin-table">
            <thead>
                <tr>
                    <th>用户名</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>最近登录</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="admin-tbody"></tbody>
        </table>
    </div>

    <div id="users-tab-roles" class="users-tab" style="display:none">
        <div id="roles-container" class="role-list"></div>
    </div>
</div>

<!-- Tenant detail modal -->
<div id="tenant-detail-modal" class="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3>租户详情</h3>
            <button id="tenant-detail-close" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body" id="tenant-detail-body"></div>
    </div>
</div>

<!-- Admin create/edit modal -->
<div id="admin-modal" class="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3 id="admin-modal-title">新建账号</h3>
            <button id="admin-modal-close" class="modal-close-btn">&times;</button>
        </div>
        <form id="admin-form" class="modal-body">
            <div class="form-group" id="admin-username-group">
                <label for="admin-username">用户名</label>
                <input type="text" id="admin-username" placeholder="以字母开头，3-32 位" pattern="^[a-zA-Z][a-zA-Z0-9_.\-]{2,31}$">
            </div>
            <div class="form-group" id="admin-password-group">
                <label for="admin-password">初始密码</label>
                <input type="password" id="admin-password" placeholder="至少 10 位" minlength="10">
            </div>
            <div class="form-group">
                <label for="admin-role">角色</label>
                <select id="admin-role"></select>
            </div>
            <div class="form-group" id="admin-disabled-group" style="display:none">
                <label class="checkbox-label"><input type="checkbox" id="admin-disabled"> 禁用账号</label>
            </div>
            <div class="modal-footer">
                <button type="button" id="admin-modal-cancel" class="btn-secondary">取消</button>
                <button type="submit" class="btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- Role permission edit modal -->
<div id="role-modal" class="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3 id="role-modal-title">编辑角色权限</h3>
            <button id="role-modal-close" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body" id="role-modal-body"></div>
        <div class="modal-footer">
            <button type="button" id="role-modal-cancel" class="btn-secondary">取消</button>
            <button type="button" id="role-modal-save" class="btn-primary">保存</button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/users.js"></script>
<script>initUsers();</script>
{% endblock %}
