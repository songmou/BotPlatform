{% extends "base.html" %}
{% block title %}组织工作台 - BotPlatform{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/organization-module.css?v=20260803a"><link rel="stylesheet" href="/static/css/agents.css"><link rel="stylesheet" href="/static/css/schedules.css">{% endblock %}
{% block content %}
<div class="organization-page" id="organization-page" data-module="{{ module }}">
    <div class="page-header organization-page-header">
        <div>
            <div class="organization-eyebrow" id="organization-name">组织工作台</div>
            <h2 id="organization-module-title">加载中…</h2>
            <p class="page-desc" id="organization-module-description"></p>
        </div>
        <div class="organization-actions">
            <button id="organization-primary-action" class="btn-primary" type="button" hidden></button>
            <button id="organization-refresh" class="btn-secondary" type="button">刷新</button>
        </div>
    </div>
    <div id="organization-module-notice" class="status-card" hidden></div>
    <div id="organization-module-summary" class="organization-summary"></div>
    <div id="organization-module-list" class="organization-grid" aria-live="polite"></div>
</div>

<div id="organization-agent-modal" class="modal-overlay" style="display:none">
    <div class="modal modal-xl">
        <div class="modal-header"><h3 id="organization-agent-modal-title">新建智能体</h3><button id="organization-agent-modal-close" class="modal-close-btn" type="button">&times;</button></div>
        <form id="organization-agent-form" class="modal-body">
            <div class="form-group" id="organization-agent-template-group"><label for="organization-agent-template">创建来源</label><select id="organization-agent-template"><option value="">空白智能体</option></select><small>选择平台模板后会载入该版本快照，保存后由组织独立维护。</small></div>
            <div class="tab-bar organization-agent-tabs" role="tablist">
                <button class="tab-btn active" type="button" data-org-agent-tab="basic">基础信息</button>
                <button class="tab-btn" type="button" data-org-agent-tab="model">模型与提示词</button>
                <button class="tab-btn" type="button" data-org-agent-tab="builtin">内置工具</button>
                <button class="tab-btn" type="button" data-org-agent-tab="plugin">插件工具</button>
                <button class="tab-btn" type="button" data-org-agent-tab="skill">Skill</button>
                <button class="tab-btn" type="button" data-org-agent-tab="mcp">MCP</button>
                <button class="tab-btn" type="button" data-org-agent-tab="knowledge">知识库</button>
            </div>
            <div class="organization-agent-panel" data-org-agent-panel="basic">
                <div class="form-group"><label for="organization-agent-id">智能体 ID</label><input id="organization-agent-id" required pattern="^[a-z][a-z0-9_]{0,63}$"><small id="organization-agent-id-help">小写字母开头，可含数字和下划线</small></div>
                <div class="form-group"><label for="organization-agent-name">名称</label><input id="organization-agent-name" required></div>
                <div class="form-group"><label for="organization-agent-role">角色定位</label><input id="organization-agent-role"></div>
                <div class="form-group"><label for="organization-agent-description">描述</label><input id="organization-agent-description"></div>
                <label class="checkbox-label"><input id="organization-agent-enabled" type="checkbox" checked> 启用智能体</label>
                <div id="organization-agent-source" class="status-card" hidden></div>
            </div>
            <div class="organization-agent-panel" data-org-agent-panel="model" hidden>
                <div class="form-group"><label for="organization-agent-model">使用模型</label><select id="organization-agent-model"><option value="">跟随默认模型</option></select></div>
                <div class="form-group"><label for="organization-agent-prompt">系统提示词</label><textarea id="organization-agent-prompt" rows="7" required></textarea></div>
                <div class="form-group"><label for="organization-agent-greeting">开场白</label><input id="organization-agent-greeting"></div>
                <div class="form-group"><label for="organization-agent-hints">引导问题</label><input id="organization-agent-hints" placeholder="用分号分隔"></div>
                <div class="form-row"><div class="form-group form-group-half"><label for="organization-agent-temperature">温度</label><input id="organization-agent-temperature" type="number" min="0" max="2" step="0.1"></div><div class="form-group form-group-half"><label for="organization-agent-max-tokens">最大 Token</label><input id="organization-agent-max-tokens" type="number" min="1" max="128000"></div></div>
            </div>
            <div class="organization-agent-panel" data-org-agent-panel="builtin"><div class="tool-checkboxes" id="organization-agent-builtin-tools"></div></div>
            <div class="organization-agent-panel" data-org-agent-panel="plugin"><div class="tool-plugin-groups" id="organization-agent-plugin-tools"></div></div>
            <div class="organization-agent-panel" data-org-agent-panel="skill"><div class="tool-checkboxes" id="organization-agent-skills"></div></div>
            <div class="organization-agent-panel" data-org-agent-panel="mcp"><div class="tool-checkboxes" id="organization-agent-mcp"></div></div>
            <div class="organization-agent-panel" data-org-agent-panel="knowledge"><div class="tool-checkboxes" id="organization-agent-knowledge"></div></div>
            <div class="modal-footer"><button type="button" id="organization-agent-modal-cancel" class="btn-secondary">取消</button><button type="submit" class="btn-primary">保存</button></div>
        </form>
    </div>
</div>

<div id="organization-schedule-modal" class="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header"><h3 id="organization-schedule-modal-title">新建定时任务</h3><button id="organization-schedule-modal-close" class="modal-close-btn" type="button">&times;</button></div>
        <form id="organization-schedule-form" class="modal-body">
            <div class="form-group"><label for="organization-schedule-id">任务 ID</label><input id="organization-schedule-id" required pattern="^[a-z][a-z0-9_-]{0,63}$"><small id="organization-schedule-id-help">编辑时任务 ID 不可修改</small></div>
            <label class="checkbox-label"><input id="organization-schedule-enabled" type="checkbox"> 启用任务</label>
            <div class="form-group"><label for="organization-schedule-crons">Cron 表达式（每行一个）</label><textarea id="organization-schedule-crons" rows="3" required></textarea><small id="organization-schedule-timezone"></small></div>
            <div class="form-group"><label for="organization-schedule-action-type">动作类型</label><select id="organization-schedule-action-type"><option value="text">文本消息</option><option value="agent_prompt">智能体生成</option><option value="script">平台脚本</option><option value="plugin">平台插件工具</option></select></div>
            <div class="form-group" id="organization-schedule-text-group"><label for="organization-schedule-content">文本内容</label><textarea id="organization-schedule-content" rows="4"></textarea></div>
            <div class="form-group" id="organization-schedule-agent-group" hidden><label for="organization-schedule-agent">智能体</label><select id="organization-schedule-agent"></select><label for="organization-schedule-prompt" style="margin-top:8px">提示词</label><textarea id="organization-schedule-prompt" rows="4"></textarea></div>
            <div class="form-group" id="organization-schedule-script-group" hidden><label for="organization-schedule-script">平台脚本</label><select id="organization-schedule-script"></select></div>
            <div class="form-group" id="organization-schedule-plugin-group" hidden><label for="organization-schedule-plugin">平台插件</label><select id="organization-schedule-plugin"></select><label for="organization-schedule-tool" style="margin-top:8px">插件工具</label><select id="organization-schedule-tool"></select></div>
            <div class="form-group" id="organization-schedule-parameters-group" hidden><label for="organization-schedule-parameters">动作参数（JSON 对象）</label><textarea id="organization-schedule-parameters" rows="6" class="code-input">{}</textarea></div>
            <div class="modal-footer"><button type="button" id="organization-schedule-modal-cancel" class="btn-secondary">取消</button><button type="submit" class="btn-primary">保存</button></div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>initOrganizationModule();</script>
{% endblock %}
