{% extends "base.html" %}
{% block title %}智能体管理 - BotPlatform{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="page-header-row">
            <div>
                <h2>智能体管理</h2>
                <p class="page-desc">创建、编辑和管理智能体预设</p>
            </div>
            <button id="create-agent-btn" class="btn-primary">+ 新建智能体</button>
        </div>
    </div>
    <div id="agent-list" class="agent-grid"></div>
</div>

<!-- Modal -->
<div id="agent-modal" class="modal-overlay" style="display:none">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">新建智能体</h3>
            <button id="modal-close" class="modal-close-btn">&times;</button>
        </div>
        <form id="agent-form" class="modal-body">
            <div class="form-group" id="form-id-group">
                <label for="agent-id">ID（唯一标识）</label>
                <input type="text" id="agent-id" placeholder="如 my_agent" required pattern="^[a-z][a-z0-9_]{0,63}$">
                <small>小写字母开头，可含数字和下划线</small>
            </div>
            <div class="form-group">
                <label for="agent-name">名称</label>
                <input type="text" id="agent-name" placeholder="如 写作助手" required>
            </div>
            <div class="form-group">
                <label for="agent-role">角色定位</label>
                <input type="text" id="agent-role" placeholder="如 专注学术写作的编辑">
            </div>
            <div class="form-group">
                <label for="agent-desc">描述</label>
                <input type="text" id="agent-desc" placeholder="简短描述该智能体的用途">
            </div>
            <div class="form-group">
                <label for="agent-model">使用模型</label>
                <select id="agent-model">
                    <option value="">跟随默认模型</option>
                </select>
                <small>可为该智能体指定专用模型，留空则使用当前主模型</small>
            </div>
            <div class="form-group">
                <label for="agent-greeting">开场白</label>
                <input type="text" id="agent-greeting" placeholder="如 你好！我是写作助手，有什么可以帮你？">
                <small>新对话时自动展示的欢迎语，留空使用默认</small>
            </div>
            <div class="form-group">
                <label for="agent-hints">引导问题</label>
                <input type="text" id="agent-hints" placeholder="用分号分隔，如 帮我写总结;翻译这段话;润色文章">
                <small>新对话时展示的快捷提问按钮，多个用分号隔开</small>
            </div>
            <div class="form-row">
                <div class="form-group form-group-half">
                    <label for="agent-temperature">温度 <span id="temp-value">默认</span></label>
                    <input type="range" id="agent-temperature" min="0" max="2" step="0.1" value="">
                    <small>越高越有创造力，越低越精确</small>
                </div>
                <div class="form-group form-group-half">
                    <label for="agent-max-tokens">最大 Token</label>
                    <input type="number" id="agent-max-tokens" min="1" max="128000" placeholder="留空使用默认">
                    <small>限制回复长度</small>
                </div>
            </div>
            <div class="form-group">
                <label for="agent-prompt">系统提示词</label>
                <textarea id="agent-prompt" rows="6" placeholder="定义智能体的行为和规则..."></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" id="modal-cancel" class="btn-secondary">取消</button>
                <button type="submit" class="btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>initAgents();</script>
{% endblock %}
