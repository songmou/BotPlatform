<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotPlatform{% endblock %}</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("bp-theme") || "light";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/app.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <div id="confirm-overlay" class="modal-overlay" style="display:none">
        <div class="modal confirm-modal">
            <div class="modal-body">
                <p id="confirm-message" class="confirm-message"></p>
                <div class="modal-footer">
                    <button id="confirm-cancel" class="btn-secondary">取消</button>
                    <button id="confirm-ok" class="btn-primary">确定</button>
                </div>
            </div>
        </div>
    </div>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo">BotPlatform</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">工作台</div>
                <a href="/" class="nav-item {% if active == 'chat' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>对话</span>
                </a>

                <div class="nav-section-label">智能能力</div>
                <a href="/models" class="nav-item {% if active == 'models' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    <span>模型</span>
                </a>
                <a href="/agents" class="nav-item {% if active == 'agents' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M16 14H8a4 4 0 0 0-4 4v2h16v-2a4 4 0 0 0-4-4z"/></svg>
                    <span>智能体</span>
                </a>
                <div class="nav-group {% if active == 'tools' or active == 'scripts' %}open{% endif %}">
                    <a href="/tools#builtin" class="nav-item nav-group-toggle {% if active == 'tools' or active == 'scripts' %}active{% endif %}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4l-2.8 2.8-2.8-.7-.7-2.8 2.8-2.3z"/></svg>
                        <span>工具</span>
                        <svg class="nav-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </a>
                    <div class="nav-sub">
                        <a href="/tools#builtin" class="nav-sub-item" data-tab="builtin">内置工具</a>
                        <a href="/tools#plugins" class="nav-sub-item" data-tab="plugins">插件工具</a>
                        <a href="/tools#skills" class="nav-sub-item" data-tab="skills">Skill 技能</a>
                        <a href="/tools#mcp" class="nav-sub-item" data-tab="mcp">MCP 服务</a>
                        <a href="/scripts" class="nav-sub-item {% if active == 'scripts' %}active{% endif %}">运维脚本</a>
                        <a href="/tools#audit" class="nav-sub-item" data-tab="audit">执行审计</a>
                    </div>
                </div>

                <div class="nav-section-label">内容资源</div>
                <a href="/knowledge" class="nav-item {% if active == 'knowledge' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4z"/><path d="M4 16a4 4 0 0 1 4-4h12"/><line x1="8" y1="8" x2="14" y2="8"/></svg>
                    <span>知识库</span>
                </a>
                <a href="/drive" class="nav-item {% if active == 'drive' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 16.5A4.5 4.5 0 0 0 16.5 12h-.7A6 6 0 0 0 4 13.5 4 4 0 0 0 5 21h13a3.5 3.5 0 0 0 2-6.5z"/></svg>
                    <span>文件管理</span>
                </a>

                <div class="nav-section-label">运营</div>
                <a href="/plugins" class="nav-item {% if active == 'plugins' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <span>消息渠道</span>
                </a>
                <a href="/schedules" class="nav-item {% if active == 'schedules' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
                    <span>定时任务</span>
                </a>

                <div class="nav-section-label">系统</div>
                <div class="nav-group {% if active == 'users' %}open{% endif %}">
                    <a href="/users#tenants" class="nav-item nav-group-toggle {% if active == 'users' %}active{% endif %}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span>用户与权限</span>
                        <svg class="nav-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </a>
                    <div class="nav-sub">
                        <a href="/users#tenants" class="nav-sub-item" data-tab="tenants">机器人用户</a>
                        <a href="/users#admins" class="nav-sub-item" data-tab="admins" id="nav-sub-admins">管理员账号</a>
                        <a href="/users#roles" class="nav-sub-item" data-tab="roles" id="nav-sub-roles">角色权限</a>
                    </div>
                </div>
                <a href="/docs" class="nav-item {% if active == 'docs' %}active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span>帮助文档</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span id="current-user" class="current-user"></span>
                    <div class="sidebar-user-actions">
                        <button id="theme-toggle" class="theme-btn" type="button"
                                title="切换主题" aria-label="切换主题">
                            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        </button>
                        <button id="logout-btn" class="theme-btn" type="button"
                                title="退出登录" aria-label="退出登录">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/js/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
