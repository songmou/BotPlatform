<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧边栏主题预览 - BotPlatform</title>
<style>
/* ===== 以下 CSS 摘录自 src/api/static/app.css（已应用本改动） ===== */
:root {
    --bg: #ffffff;
    --bg-secondary: #f8fafc;
    --bg-hover: #f1f2f6;
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border: #e6e8ec;
    --accent: #4353ff;
    --accent-light: #eef0ff;
    --grad-accent: linear-gradient(135deg, #6573e6 0%, #8f78dc 100%);
    --sidebar-width: 220px;
    --radius: 8px;
    /* Sidebar theme (light default) */
    --sidebar-bg: #f8fafc;
    --sidebar-border: #e6e8ec;
    --sidebar-text: #475569;
    --sidebar-text-strong: #0f172a;
    --sidebar-text-muted: #94a3b8;
    --sidebar-hover-bg: #f1f2f6;
    --sidebar-hover-text: #0f172a;
    --sidebar-active-bg: #eef0ff;
    --sidebar-active-text: #4353ff;
    --sidebar-active-bar: #4353ff;
    --sidebar-badge-bg: #f1f2f6;
    --sidebar-badge-text: #475569;
    --sidebar-badge-border: #e6e8ec;
    --sidebar-scope-bg: #eef1f5;
    --sidebar-scope-border: #e6e8ec;
    --sidebar-scope-inactive-text: #64748b;
    --sidebar-scope-active-bg: linear-gradient(135deg, #6573e6 0%, #8f78dc 100%);
    --sidebar-scope-active-text: #ffffff;
    --sidebar-logo-gradient: linear-gradient(135deg, #6573e6 0%, #8f78dc 100%);
}
[data-theme="dark"] {
    --bg: #151515;
    --bg-secondary: #1e1e1e;
    --bg-hover: #2a2a2a;
    --text: #e8e8e8;
    --text-secondary: #aaa;
    --text-muted: #777;
    --border: #333;
    --accent: #5b6aff;
    --accent-light: #1e2040;
    --sidebar-bg: #1b1f2e;
    --sidebar-border: rgba(255, 255, 255, 0.07);
    --sidebar-text: #cbd5e1;
    --sidebar-text-strong: #ffffff;
    --sidebar-text-muted: #94a3b8;
    --sidebar-hover-bg: rgba(255, 255, 255, 0.06);
    --sidebar-hover-text: #ffffff;
    --sidebar-active-bg: rgba(91, 106, 255, 0.16);
    --sidebar-active-text: #ffffff;
    --sidebar-active-bar: var(--grad-accent);
    --sidebar-badge-bg: rgba(255, 255, 255, 0.08);
    --sidebar-badge-text: #cbd5e1;
    --sidebar-badge-border: rgba(255, 255, 255, 0.12);
    --sidebar-scope-bg: rgba(9, 14, 29, 0.24);
    --sidebar-scope-border: rgba(255, 255, 255, 0.08);
    --sidebar-scope-inactive-text: #94a3b8;
    --sidebar-scope-active-bg: linear-gradient(135deg, rgba(101, 115, 230, 0.92), rgba(143, 120, 220, 0.88));
    --sidebar-scope-active-text: #ffffff;
    --sidebar-logo-gradient: linear-gradient(135deg, #8b98e6 0%, #a894cf 100%);
}
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; }
.layout { display:flex; height:100vh; }
.sidebar { width:var(--sidebar-width); background:var(--sidebar-bg); border-right:1px solid var(--sidebar-border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header { padding:18px 14px 14px; border-bottom:1px solid var(--sidebar-border); }
.sidebar-header .logo { display:inline-block; margin:0 4px 15px; background:var(--sidebar-logo-gradient); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; font-size:17px; font-weight:700; }
.sidebar-scope-tabs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; padding:3px; border:1px solid var(--sidebar-scope-border); border-radius:11px; background:var(--sidebar-scope-bg); }
.sidebar-scope-tab { display:flex; align-items:center; justify-content:center; gap:5px; min-height:30px; padding:5px 8px; border-radius:6px; color:var(--sidebar-scope-inactive-text); font-size:12px; font-weight:600; text-decoration:none; transition:color .15s ease,background .15s ease,box-shadow .15s ease; }
.sidebar-scope-tab:hover { color:var(--sidebar-text-strong); background:var(--sidebar-hover-bg); }
.sidebar-scope-tab.active { color:var(--sidebar-scope-active-text); background:var(--sidebar-scope-active-bg); box-shadow:0 5px 14px -7px rgba(91,106,255,.9); }
.scope-tab-dot { width:6px; height:6px; border:1px solid currentColor; border-radius:50%; opacity:.8; }
.sidebar-scope-tab.active .scope-tab-dot { border-color:var(--sidebar-scope-active-text); background:var(--sidebar-scope-active-text); box-shadow:0 0 0 3px rgba(255,255,255,.15); }
.sidebar-nav { flex:1; padding:12px 8px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
.nav-section-label { margin:12px 12px 4px; color:var(--sidebar-text-muted); font-size:11px; font-weight:600; letter-spacing:.08em; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius); color:var(--sidebar-text); text-decoration:none; font-size:14px; transition:all .15s ease; }
.nav-item:hover { background:var(--sidebar-hover-bg); color:var(--sidebar-hover-text); }
.nav-item.active { position:relative; background:var(--sidebar-active-bg); color:var(--sidebar-active-text); font-weight:600; }
.nav-item.active::before { content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:60%; border-radius:999px; background:var(--sidebar-active-bar); }
.nav-sub-item { display:flex; align-items:center; gap:9px; padding:8px 12px 8px 34px; border-radius:var(--radius); color:var(--sidebar-text); text-decoration:none; font-size:13px; transition:all .15s ease; position:relative; }
.nav-sub-item::before { content:""; position:absolute; left:16px; top:50%; transform:translateY(-50%); width:5px; height:5px; border-radius:50%; background:var(--sidebar-text-muted); }
.nav-sub-item:hover { background:var(--sidebar-hover-bg); color:var(--sidebar-hover-text); }
.nav-sub-item.active { background:var(--sidebar-active-bg); color:var(--sidebar-active-text); font-weight:500; }
.nav-sub-item.active::before { background:var(--sidebar-active-bar); }
.sidebar-footer { padding:12px 16px; border-top:1px solid var(--sidebar-border); }
.sidebar-user { display:flex; align-items:center; gap:10px; min-width:0; }
.sidebar-user-actions { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-left:auto; flex-shrink:0; }
.current-user { color:var(--sidebar-text-muted); }
.theme-btn { display:flex; align-items:center; justify-content:center; width:32px; height:32px; border:none; background:var(--bg-hover); border-radius:var(--radius); color:var(--text-secondary); cursor:pointer; }
.theme-btn:hover { color:var(--text); background:var(--border); }
[data-theme="light"] .icon-sun { display:none; }
[data-theme="dark"] .icon-moon { display:none; }
/* main content for context */
.main-content { flex:1; background:var(--bg); color:var(--text); padding:32px; }
.main-content h2 { margin:0 0 8px; font-size:22px; }
.main-content p { color:var(--text-secondary); }
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo">BotPlatform</span>
            <div class="sidebar-scope-tabs" role="navigation" aria-label="工作区切换">
                <a href="#" class="sidebar-scope-tab active" aria-current="page"><span class="scope-tab-dot"></span>平台</a>
                <a href="#" class="sidebar-scope-tab"><span class="scope-tab-dot"></span>组织</a>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">平台管理</div>
            <a href="#" class="nav-item">平台概览</a>
            <a href="#" class="nav-item active">模型服务</a>
            <a href="#" class="nav-item">智能体模板</a>
            <a href="#" class="nav-item">系统工具</a>
            <a href="#" class="nav-sub-item">工具</a>
            <a href="#" class="nav-sub-item active">MCP</a>
            <div class="nav-section-label">组织工作台</div>
            <a href="#" class="nav-item">对话</a>
            <a href="#" class="nav-item">知识库</a>
            <div class="nav-section-label">帮助</div>
            <a href="#" class="nav-item">帮助文档</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="current-user">admin</span>
                <div class="sidebar-user-actions">
                    <button id="theme-toggle" class="theme-btn" type="button" title="切换主题">
                        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>
                    </button>
                    <button class="theme-btn" type="button">⎋</button>
                </div>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <h2>主内容区（示例）</h2>
        <p>点击左下角月亮/太阳按钮，左侧菜单与主内容区会同步切换深浅主题。默认进入为浅色菜单，与右侧白底主内容协调一致。</p>
    </main>
</div>
<script>
document.getElementById("theme-toggle").addEventListener("click", function () {
    var html = document.documentElement;
    var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
});
</script>
</body>
</html>
